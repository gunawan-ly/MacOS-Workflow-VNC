name: macOS VNC

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure macOS VNC
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
          VNC_USER_PASSWORD: ${{ secrets.VNC_USER_PASSWORD }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          chmod +x configure.sh
          ./configure.sh \
            "$VNC_USER_PASSWORD" \
            "$VNC_PASSWORD" \
            "$NGROK_AUTH_TOKEN"

      - name: Show VNC tunnel
        run: |
          echo "=== NGROK TUNNELS ==="
          curl --silent http://127.0.0.1:4040/api/tunnels | jq '.tunnels'
